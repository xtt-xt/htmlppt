plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.htmlppt'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.htmlppt"
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // 本地原生 Activity + WebView，无需第三方依赖
}
