<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>编辑 - HTML PPT</title>
<link rel="stylesheet" href="theme.css">
<style>
  html,body{height:100%;}
  body{display:flex; flex-direction:column; position:relative;}
  .topbar{position:relative;}
  #main{flex:1; min-height:0; position:relative;}
  textarea#editor{width:100%; height:100%; border:none; outline:none; background:rgba(0,0,0,.25); color:var(--text); padding:16px; font-family:"SFMono-Regular",Consolas,monospace; font-size:14px; line-height:1.6; resize:none;}
  #preview{position:absolute; inset:0; display:none;}
  #preview.show{display:block;}
  .tab{background:transparent; border:none; padding:8px 6px; color:var(--muted); font-size:14px; cursor:pointer; border-bottom:2px solid transparent;}
  .tab.sel{color:var(--accent); border-bottom-color:var(--accent);}
  /* 播放态：隐藏顶栏，舞台铺满 */
  body.presenting .topbar{display:none;}
  body.presenting #main{position:absolute; inset:0; z-index:5;}
  body.presenting .footbar{position:absolute; bottom:0; left:0; right:0; z-index:10;}
</style>
</head>
<body>

<div class="topbar" id="topbar">
  <button class="tbtn ghost" id="back-btn">返回</button>
  <div class="brand" id="doc-title" style="font-size:16px;"></div>
  <div class="spacer"></div>
  <button class="tab sel" id="tab-edit">编辑</button>
  <button class="tab" id="tab-preview">预览</button>
  <button class="tbtn" id="save-btn">保存</button>
  <button class="tbtn primary" id="play-btn">播放</button>
</div>

<div id="main">
  <textarea id="editor" spellcheck="false"></textarea>
  <div id="preview">
    <div id="stage"></div>
  </div>
</div>

<div class="footbar">
  <button class="navbtn" id="prev-btn">◀</button>
  <div class="pageinfo" id="pageinfo">1 / 1</div>
  <div class="progress"><span></span></div>
  <button class="navbtn" id="next-btn">▶</button>
  <button class="tbtn ghost" id="exit-btn" style="display:none;">退出</button>
</div>

<script src="app.js"></script>
<script>
var name = new URLSearchParams(location.search).get('name') || '未命名.txt';
var autoPlay = new URLSearchParams(location.search).get('play') == '1';
var slides = [];
var current = 0;
var mode = 'edit'; // edit | preview | presenting

window.addEventListener('load', function(){
  PPT.loadSettings();
  PPT.applyGlobalTheme(PPT.settings.theme || 'aurora');
  document.getElementById('doc-title').textContent = name.replace(/\.txt$/,'');
  document.getElementById('editor').value = Android.readPpt(name) || '';
  bindEvents();
  renderPreview();
  if(autoPlay) enterPresent();
});

function bindEvents(){
  document.getElementById('back-btn').onclick = function(){ location.href='index.html'; };
  document.getElementById('save-btn').onclick = save;
  document.getElementById('tab-edit').onclick = function(){ setMode('edit'); };
  document.getElementById('tab-preview').onclick = function(){ setMode('preview'); };
  document.getElementById('play-btn').onclick = enterPresent;
  document.getElementById('prev-btn').onclick = function(){ activate(current-1); };
  document.getElementById('next-btn').onclick = function(){ activate(current+1); };
  document.getElementById('exit-btn').onclick = exitPresent;
  document.getElementById('editor').addEventListener('input', function(){
    // 实时保持在预览/播放模式基于新内容
    if(mode!=='edit') renderPreview();
  });
  document.addEventListener('keydown', function(e){
    if(mode!=='presenting') return;
    if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown') activate(current+1);
    else if(e.key==='ArrowLeft'||e.key==='PageUp') activate(current-1);
    else if(e.key==='Escape') exitPresent();
  });
  // 触摸滑动翻页（仅预览/播放）
  var tx=null;
  var area = document.getElementById('preview');
  area.addEventListener('touchstart', function(e){ tx=e.touches[0].clientX; }, {passive:true});
  area.addEventListener('touchend', function(e){
    if(tx===null) return;
    var d=e.changedTouches[0].clientX-tx;
    if(Math.abs(d)>50) d<0?activate(current+1):activate(current-1);
    tx=null;
  }, {passive:true});
  document.addEventListener('fullscreenchange', function(){});
  // 全局主题点
  renderThemeDots();
}

function renderThemeDots(){
  var host = document.getElementById('topbar');
  // 在播放按钮前插入主题点
  var box = document.createElement('span');
  box.id='theme-dots-edit';
  box.className='theme-dots';
  PPT.listThemeNames().forEach(function(t){
    var key=t.key||t.name;
    var d=document.createElement('div');
    d.className='tdot'+(key===PPT.settings.theme?' sel':'');
    d.style.background='linear-gradient(135deg,'+t.c1+','+t.c3+')';
    d.title=t.name;
    d.onclick=function(){ PPT.settings.theme=key; PPT.applyGlobalTheme(key); PPT.saveSettings(); renderThemeDots(); if(mode!=='edit') renderPreview(); };
    box.appendChild(d);
  });
  var old=document.getElementById('theme-dots-edit'); if(old) old.remove();
  host.insertBefore(box, document.getElementById('save-btn'));
}

function save(){
  Android.savePpt(name, document.getElementById('editor').value);
  alert('已保存');
}

function setMode(m){
  mode=m;
  document.getElementById('tab-edit').classList.toggle('sel', m==='edit');
  document.getElementById('tab-preview').classList.toggle('sel', m==='preview');
  document.getElementById('editor').style.display = (m==='edit')?'block':'none';
  document.getElementById('preview').classList.toggle('show', m!=='edit');
  document.getElementById('footbar') && document.getElementById('exit-btn').style.display='none';
  if(m!=='edit') renderPreview();
}

function parseContent(){ slides = PPT.parse(document.getElementById('editor').value); if(!slides.length){ slides=[{title:'空内容',subtitle:'请输入文字',blocks:[],centered:false,footer:'',theme:null}]; } }

function renderPreview(){
  parseContent();
  PPT.renderSlides(document.getElementById('stage'), slides, current);
  // clamp current
  current=Math.max(0,Math.min(slides.length-1,current));
}

function activate(idx){
  current = PPT.activate(document.getElementById('stage'), idx);
}

function enterPresent(){
  mode='presenting';
  document.body.classList.add('presenting');
  renderPreview();
  document.getElementById('exit-btn').style.display='';
  if(document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
}
function exitPresent(){
  mode='preview';
  document.body.classList.remove('presenting');
  document.getElementById('exit-btn').style.display='none';
  if(document.exitFullscreen) document.exitFullscreen();
}
</script>
</body>
</html>
